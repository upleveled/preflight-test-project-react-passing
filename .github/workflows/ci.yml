name: CI
on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build create-react-app app
        run: pnpm build
      - name: Run TypeScript Compiler
        run: pnpm tsc
      - name: Run ESLint
        run: pnpm eslint . --max-warnings 0
      - name: Run Stylelint
        run: pnpm stylelint '**/*.{css,scss,less,js,tsx}'
      - name: Install and run Preflight
        run: |
          # --config flag: avoid the default 1-day minimumReleaseAge for pnpm
          pnpm add --global --config.minimumReleaseAgeExclude='@upleveled/preflight' @upleveled/preflight
          preflight
